<!-- 雾谷晨行设计提醒：元信息保持中性默认语言；运行时会随用户选择更新文档语言。 -->
<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Primary SEO -->
    <title>Punthuk Setumbu Magelang — Panduan Wisata</title>
    <meta name="description" content="Plan your sunrise at Punthuk Setumbu Hill, a Menoreh Hills viewpoint overlooking Borobudur. Find ticket price (~IDR 20,000), opening hours (04:00–17:00 WIB), directions from Borobudur, and nearby cafés." />
    <link rel="canonical" href="https://setumbuhill.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Punthuk Setumbu Magelang — Panduan Wisata" />
    <meta property="og:title" content="Punthuk Setumbu Magelang — Panduan Wisata: Titik Pandang Matahari Terbit & Borobudur" />
    <meta property="og:description" content="A Menoreh Hills sunrise viewpoint above Borobudur. Ticket price, opening hours, directions, and nearby cafés for planning your visit." />
    <meta property="og:url" content="https://setumbuhill.com/" />
    <meta property="og:image" content="https://setumbuhill.com/images/punthuk-setumbu-mountains.jpg" />
    <meta property="og:image:alt" content="Sunrise over the Menoreh Hills with a distant view of Borobudur from Punthuk Setumbu" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:locale:alternate" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Punthuk Setumbu Hill — Sunrise Viewpoint & Borobudur Guide" />
    <meta name="twitter:description" content="A Menoreh Hills sunrise viewpoint above Borobudur. Ticket price, opening hours, directions, and nearby cafés for planning your visit." />
    <meta name="twitter:image" content="https://setumbuhill.com/images/punthuk-setumbu-mountains.jpg" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Static structured data (runtime also injects language-specific JSON-LD). -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TouristAttraction",
      "@id": "https://setumbuhill.com/#attraction",
      "name": "Punthuk Setumbu",
      "description": "A sunrise viewpoint in the Menoreh Hills near Borobudur, Central Java, Indonesia.",
      "url": "https://setumbuhill.com/",
      "image": "https://setumbuhill.com/images/punthuk-setumbu-mountains.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Borobudur",
        "addressRegion": "Central Java",
        "addressCountry": "ID"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": -7.608743098093699,
        "longitude": 110.17662085684644
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "04:00",
          "closes": "17:00"
        }
      ],
      "priceRange": "IDR 20,000 approx.",
      "isAccessibleForFree": false,
      "tourBookingPage": "https://setumbuhill.com/"
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script defer src="%VITE_ANALYTICS_ENDPOINT%/umami" data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
